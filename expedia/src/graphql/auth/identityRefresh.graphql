query identityRefresh($context: ContextInput!) { identityRefresh(context: $context) { action profile { __typename ...travelerProfile } loyaltyMembershipInfo { __typename ...travelerLoyaltyMembershipInfo } } }  fragment travelerProfile on Profile { tuid expUserId firstName middleName lastName emailAddress }  fragment tierMaintenanceAndProgressCriteria on TierMaintenanceAndProgressCriteria { __typename hotelNights tierName }  fragment travelerLoyaltyAmount on LoyaltyAmount { __typename amount currencyCode formattedPrice }  fragment travelerLoyaltyMembershipInfo on LoyaltyMembershipInfo { bookingCurrency currentLoyaltyTierCredits { __typename ...tierMaintenanceAndProgressCriteria } enrolledInRewardsDate isAllowedToShopWithPoints loyaltyMembershipActive loyaltyMonetaryValue { __typename ...travelerLoyaltyAmount } loyaltyPointsAvailable loyaltyPointsPending membershipTierName tierProgressionCredit { __typename ...tierMaintenanceAndProgressCriteria } isUserOneKey }
