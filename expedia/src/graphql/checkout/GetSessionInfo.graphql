query GetSessionInfo($context: ContextInput!, $sessionID: UUID!, $isValidate: Boolean) { checkout(context: $context) { getSession(sessionID: $sessionID, isValidate: $isValidate) { token signals { __typename ...checkoutUISignal } serverSignals { __typename ...uISignalSharedType } } } }  fragment checkoutDomainInfo on CheckoutDomainInfo { name refId }  fragment signalDetail on SignalDetail { detailedDescription summary reasonUrn }  fragment checkoutUISignal on CheckoutUISignal { signal domainInfoList { __typename ...checkoutDomainInfo } payload { __typename ...signalDetail } }  fragment graphQLPair on GraphQLPair { key value }  fragment uISignalSummary on UISignalSummary { description reasonUrn summary }  fragment uISignalPayloadSharedType on UISignalPayloadSharedType { metadata { __typename ...graphQLPair } publisherModule signalDetails { __typename ...uISignalSummary } signalUrn }  fragment uISignalSharedType on UISignalSharedType { topic payload { __typename ...uISignalPayloadSharedType } }