
  mutation SelectPaymentMethodMutation(
    $context: ContextInput
    $selectPaymentMethodRequest: SelectPaymentMethodRequestInput!
    $templateConfig: TemplateConfigInput
    $clientId: String
  ) {
    selectPaymentMethod(
      context: $context
      selectPaymentMethodRequest: $selectPaymentMethodRequest
      templateConfig: $templateConfig
      clientId: $clientId
    ) {
      __typename
      paymentCheckoutElement {
        __typename
        ...PaymentSelectCheckoutViewFragment
      }
      actions {
        ...PaymentMethodSwitchActionFragment
        ...PaymentPublishSignalActionFragment
      }
      checkoutIdentifier {
        __typename
        sessionId
        sessionToken
      }
    }
  }

  
