<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market chart</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><h1 id="title">Market chart</h1><span id="status" role="status">Connecting…</span></div><button id="edit-toggle">Edit chart</button></header>
<main><section id="chart-area"><div id="legend"></div><div id="chart"></div><div id="chart-actions"><button id="fit">Fit data</button><button id="save-zoom">Save zoom</button><button id="draw-line">Draw trendline</button><button id="draw-level">Draw horizontal level</button></div></section>
<aside id="editor"><h2>Chart settings</h2><label>Title<input id="title-input" maxlength="120"></label><label>Timeframe<select id="timeframe"><option>D</option><option>1h</option><option>15m</option><option>W</option></select></label>
<label>Date range<select id="period"><option value="year_to_date">Year to date</option><option value="last_calendar_month">Last calendar month</option><option value="last_30_days">Last 30 days</option><option value="last_90_days">Last 90 days</option><option value="last_365_days">Last 365 days</option></select></label>
<label>Values<select id="normalization"><option value="price">Raw prices</option><option value="percent">Percent change (starts at 0%)</option><option value="indexed">Index (starts at 100)</option></select></label>
<label>Price scale<select id="scale"><option value="linear">Linear</option><option value="log">Logarithmic</option></select></label><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
<button id="apply-settings">Apply settings</button><h2>Series</h2><div id="series-editor"></div><label>Add symbol<input id="new-symbol" placeholder="BITFINEX:ETHUSD"></label><button id="add-series">Add series</button>
<h2>Local indicators</h2><label>Source<select id="study-source"></select></label><div class="row"><select id="study-kind"><option>SMA</option><option>EMA</option><option>RSI</option></select><input id="study-length" type="number" min="2" max="300" value="20"></div><button id="add-study">Add indicator</button><div id="studies-editor"></div><h2>Drawings</h2><div id="drawings-editor"></div><p class="hint">Drawings use the first visible series and its displayed units. Click two points for a trendline, or one for a horizontal level.</p></aside></main>
<footer><span id="details"></span><a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView Lightweight Charts™ · © 2025 TradingView, Inc.</a></footer><script type="module" src="/app.mjs"></script></body></html>
