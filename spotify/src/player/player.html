<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify player</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292b2a;background:transparent}
*{box-sizing:border-box}body{margin:0;padding:16px}[hidden]{display:none!important}
.player{max-width:560px;margin:auto;padding:34px 32px 36px;border:1px solid #939694;border-radius:58px;background:linear-gradient(140deg,#edefeddb,#e3e6e4d9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
h1{font-size:clamp(23px,5vw,29px);font-weight:500;line-height:1.25;letter-spacing:-.035em;text-align:center;margin:0 0 9px;white-space:nowrap;overflow:hidden}.artist{font-size:21px;line-height:1.35;text-align:center;margin:0;color:#747775;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;justify-content:center;gap:42px;margin:36px 0 0}
button{font:inherit;border:0;cursor:pointer;color:#555856;background:#d5d8d5b0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:58px;height:58px;transition:transform .16s,background .16s}button:hover:enabled{background:#cdd1cdbf;transform:scale(1.04)}button:active:enabled{transform:scale(.96)}button:focus-visible{outline:2px solid #707672;outline-offset:5px}button:disabled{opacity:.35;cursor:default}.primary{width:90px;height:90px;background:#d3d6d3b5;color:#484c49}.primary svg{width:40px;height:40px}svg{width:28px;height:28px;fill:currentColor}
.primary{position:relative}.loading-ring{position:absolute;inset:-7px;border:2px solid #55585626;border-top-color:#666c68;border-radius:50%;pointer-events:none;animation:control-loading .8s linear infinite}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes control-loading{to{transform:rotate(360deg)}}
.error{font-size:12px;text-align:center;color:#893f35;margin:18px 0 0;line-height:1.5}.error:empty{display:none}
#title-track{display:inline-flex;gap:40px;white-space:nowrap}#title-text{white-space:nowrap}#title-copy{display:none}.marquee{text-align:left}.marquee #title-copy{display:inline}.marquee #title-track{animation:song-marquee var(--title-duration,12s) linear infinite;will-change:transform}
@keyframes song-marquee{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--title-distance,0px)))}}
.artwork-window{--art-size:clamp(200px,68vw,330px);--art-step:calc(var(--art-size) * .96);position:relative;overflow:hidden;isolation:isolate;margin:6px -32px 16px;padding:14px 0 12px;mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent)}
.artwork-stage{position:relative}.artwork{position:relative;width:var(--art-size);aspect-ratio:1.43;margin:0 auto;isolation:isolate}.artwork-current{left:calc(var(--art-size) * .13);z-index:2}
.disc{position:absolute;width:60%;aspect-ratio:1;right:0;top:9%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,#ffffff12 4px 5px),conic-gradient(from 25deg,#b6b9b9,#efefec 12%,#bfc5c6 23%,#e6e1cf 32%,#b6bfc0 43%,#f6f6f4 54%,#bfc4cb 65%,#e7e4d4 78%,#b6b9b9);box-shadow:inset 0 0 0 1px #ffffff88;animation:disc-spin 18s linear infinite;animation-play-state:paused}.disc:before{content:"";position:absolute;inset:39%;border:1px solid #93999988;border-radius:50%;background:radial-gradient(circle,#e6e9e6 0 34%,#bfc5c588 36% 64%,#e1e3df 66% 76%,#969d9f 78% 82%,#dededb 84%)}.artwork[data-playing="true"][data-state="ready"] .disc{animation-play-state:running}
.sleeve{position:absolute;left:2%;top:4%;width:64%;aspect-ratio:1;padding:16px;border:1px solid #fff;border-radius:29px;background:#f9faf7;box-shadow:0 7px 22px #00000012;z-index:1}.sleeve-grain{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;opacity:.13;pointer-events:none}.cover{position:relative;overflow:hidden;width:100%;height:100%;border-radius:20px;background:#d8dcda}.cover-image{display:block;width:100%;height:100%;object-fit:cover}.cover-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#929a95;background:linear-gradient(145deg,#e6e9e5,transparent)}.cover-fallback svg{width:44px;height:44px}
.artwork-neighbor{position:absolute;top:0;margin:0;opacity:.4;transform:translateX(-50%) scale(.78);filter:blur(1.8px) saturate(.65);pointer-events:none;z-index:1}.artwork-previous{left:calc(50% - var(--art-step) + var(--art-size) * .13)}.artwork-next{left:calc(50% + var(--art-step) + var(--art-size) * .13)}.artwork-ghost{position:absolute;inset:0;pointer-events:none;z-index:3}
@keyframes disc-spin{to{transform:rotate(360deg)}}
@media(max-width:350px){body{padding:8px}.player{padding:26px 22px 30px;border-radius:42px}.artwork-window{margin-left:-22px;margin-right:-22px}.controls{gap:26px}button{width:48px;height:48px}.primary{width:76px;height:76px}.sleeve{padding:11px;border-radius:21px}.cover{border-radius:13px}.artist{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.disc,.marquee #title-track,.loading-ring{animation:none}}
</style>
</head>
<body>
<main class="player" aria-label="Spotify playback controls">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="sleeve-paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs></svg>
  <div id="artwork-window" class="artwork-window">
    <div id="artwork-stage" class="artwork-stage">
      <div id="artwork-previous" class="artwork artwork-neighbor artwork-previous" data-state="empty" data-playing="false" aria-hidden="true" hidden>
        <div class="disc" aria-hidden="true"></div>
        <div class="sleeve"><svg class="sleeve-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#sleeve-paper)"/></svg><div class="cover">
          <div id="cover-fallback-previous" class="cover-fallback" role="img" aria-label="Album artwork unavailable"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v12.2A4 4 0 1 0 11 19V7l8-2v8.2A4 4 0 1 0 21 17V0z"/></svg></div>
          <img id="cover-image-previous" class="cover-image" alt="" referrerpolicy="no-referrer" hidden>
        </div></div>
      </div>
      <div id="artwork" class="artwork artwork-current" data-state="empty" data-playing="false">
        <div class="disc" aria-hidden="true"></div>
        <div class="sleeve"><svg class="sleeve-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#sleeve-paper)"/></svg><div class="cover">
          <div id="cover-fallback" class="cover-fallback" role="img" aria-label="Album artwork unavailable"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v12.2A4 4 0 1 0 11 19V7l8-2v8.2A4 4 0 1 0 21 17V0z"/></svg></div>
          <img id="cover-image" class="cover-image" alt="" referrerpolicy="no-referrer" hidden>
        </div></div>
      </div>
      <div id="artwork-next" class="artwork artwork-neighbor artwork-next" data-state="empty" data-playing="false" aria-hidden="true" hidden>
        <div class="disc" aria-hidden="true"></div>
        <div class="sleeve"><svg class="sleeve-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#sleeve-paper)"/></svg><div class="cover">
          <div id="cover-fallback-next" class="cover-fallback" role="img" aria-label="Album artwork unavailable"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v12.2A4 4 0 1 0 11 19V7l8-2v8.2A4 4 0 1 0 21 17V0z"/></svg></div>
          <img id="cover-image-next" class="cover-image" alt="" referrerpolicy="no-referrer" hidden>
        </div></div>
      </div>
    </div>
  </div>
  <h1 id="title"><span id="title-track"><span id="title-text">Connecting to Spotify…</span><span id="title-copy" aria-hidden="true"></span></span></h1>
  <p class="artist" id="artist"></p>
  <div class="controls">
    <button id="previous" aria-label="Previous track" title="Previous track" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14L2 12zm10 0v14l-10-7z"/></svg></button>
    <button id="play-pause" class="primary" aria-label="Pause" title="Pause" disabled><span id="loading-ring" class="loading-ring" aria-hidden="true" hidden></span><svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m8 3 14 9-14 9z"/></svg></button>
    <button id="next" aria-label="Next track" title="Next track" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5v14l10-7zm10 0v14l10-7z"/></svg></button>
  </div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <p id="error" class="error" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  let playback = null, displayedPlayback = null, busy = false, reading = false, stale = true;
  let bridgeReady = false, disposed = false, stateEpoch = 0;
  let nextId = 0, hostOrigin = null, newest = 0;
  const artworkKeys = new Map();
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let coverTransition = null;
  const requests = new Map();
  const pendingActions = [];
  const targets = { refresh:"spotify_status", pause:"spotify_pause", resume:"spotify_resume", previous:"spotify_previous", next:"spotify_next" };
  function controls() {
    const view = displayedPlayback || playback;
    const unavailable = stale || !view?.track || !view.deviceId || pendingActions.length >= 8;
    for (const id of ["play-pause","next","previous"]) el(id).disabled = unavailable;
    const permissions = view?.restrictions || {};
    if (permissions[view?.state === "playing" ? "canPause" : "canResume"] === false) el("play-pause").disabled = true;
    if (permissions.canSkipNext === false) el("next").disabled = true;
    if (permissions.canSkipPrevious === false) el("previous").disabled = true;
    const loading = busy || pendingActions.length > 0 || el("artwork").dataset.state === "loading" || (reading && stale);
    el("loading-ring").hidden = !loading;
    el("play-pause").setAttribute("aria-busy", String(loading));
    el("announcement").textContent = pendingActions.length ? "Updating playback…" : "";
  }
  function projectedPlayback() {
    let view = playback;
    if (!view) return view;
    for (const job of pendingActions) {
      if (job.name === "pause" || job.name === "resume") {
        const playing = job.name === "resume";
        view = {...view,state:playing ? "playing" : "paused",restrictions:{...view.restrictions,canPause:playing,canResume:!playing}};
      } else {
        // Previous may restart the current song instead of changing tracks.
        const restart = job.name === "previous" && view.positionMs >= 3000;
        const neighbor = restart ? null : view.adjacentTracks?.[job.name];
        if (neighbor) {
          view = {...view,track:neighbor,positionMs:0,durationMs:neighbor.durationMs,
            restrictions:{...view.restrictions,...(job.name === "next" ? {canSkipPrevious:true} : {canSkipNext:true})},
            adjacentTracks:job.name === "next" ? {previous:view.track,next:null} : {previous:null,next:view.track}};
        } else if (restart) view = {...view,positionMs:0};
      }
    }
    return view;
  }
  function measureTitle() {
    const width = el("title-text").getBoundingClientRect().width, available = el("title").clientWidth;
    const overflows = width > available + 1;
    el("title").classList.toggle("marquee", overflows);
    el("title-copy").textContent = overflows ? el("title-text").textContent : "";
    el("title").style.setProperty("--title-distance", (width + 40) + "px");
    el("title").style.setProperty("--title-duration", Math.max(8, (width + 40) / 35) + "s");
  }
  function setTitle(text) {
    if (el("title-text").textContent !== text) { el("title").classList.remove("marquee"); el("title-text").textContent = text; }
    el("title").setAttribute("aria-label", text); el("title").title = text;
    measureTitle();
  }
  function renderCover(track, suffix = "") {
    const artwork = el("artwork" + suffix), fallback = el("cover-fallback" + suffix);
    if (suffix) artwork.hidden = !track;
    artwork.dataset.playing = String(!suffix && displayedPlayback.state === "playing" && !stale);
    const key = JSON.stringify([track?.uri, track?.imageUrl, track?.album, track?.name]);
    if (key === artworkKeys.get(suffix)) return;
    artworkKeys.set(suffix, key);
    artwork.dataset.state = "empty"; fallback.hidden = false;
    const image = document.createElement("img");
    image.id = "cover-image" + suffix; image.className = "cover-image"; image.hidden = true;
    image.alt = track?.album ? "Album cover: " + track.album : "Cover artwork for " + (track?.name || "current track");
    image.referrerPolicy = "no-referrer"; image.decoding = "async";
    el("cover-image" + suffix).replaceWith(image);
    let url;
    try { url = new URL(track?.imageUrl); } catch { return; }
    if (url.origin !== "https://i.scdn.co" || !url.pathname.startsWith("/image/") || url.username || url.password) return;
    artwork.dataset.state = "loading";
    image.onload = () => {
      if (!image.isConnected) return;
      image.hidden = false; fallback.hidden = true; artwork.dataset.state = "ready"; controls();
    };
    image.onerror = () => {
      if (!image.isConnected) return;
      image.hidden = true; fallback.hidden = false; artwork.dataset.state = "unavailable"; controls();
    };
    image.src = url.href;
    if (image.complete && image.naturalWidth > 0) image.onload();
  }
  function renderArtwork() {
    renderCover(displayedPlayback.track);
    renderCover(displayedPlayback.adjacentTracks?.previous, "-previous");
    renderCover(displayedPlayback.adjacentTracks?.next, "-next");
    for (const [side,label] of [["previous","Previous track"],["next","Next track"]]) {
      const track = displayedPlayback.adjacentTracks?.[side];
      el(side).title = track?.name ? label + ": " + track.name : label;
    }
  }
  const sameTrack = (a,b) => !!a && !!b && a.uri === b.uri && (!a.uid || !b.uid || a.uid === b.uid);
  function clearTransition() {
    if (!coverTransition) return;
    for (const animation of coverTransition.animations) animation.cancel();
    coverTransition.ghost.remove(); coverTransition = null;
    delete el("artwork-window").dataset.transition;
  }
  function beginTransition(next, action) {
    if (!next.track) { clearTransition(); return null; }
    if (!displayedPlayback?.track || sameTrack(displayedPlayback.track,next.track)) return null;
    clearTransition();
    if (reducedMotion.matches) return null;
    const direction = action === "next" ? 1 : action === "previous" ? -1
      : sameTrack(displayedPlayback.adjacentTracks?.next,next.track) ? 1
      : sameTrack(displayedPlayback.adjacentTracks?.previous,next.track) ? -1 : 0;
    const ghost = el("artwork-stage").cloneNode(true);
    ghost.removeAttribute("id");
    for (const node of ghost.querySelectorAll("[id]")) node.removeAttribute("id");
    ghost.classList.add("artwork-ghost"); ghost.setAttribute("aria-hidden","true");
    el("artwork-stage").append(ghost);
    const transition = {ghost,animations:[],direction}; coverTransition = transition;
    return transition;
  }
  function animateTransition(transition) {
    if (!transition || coverTransition !== transition) return;
    const {direction,ghost} = transition, step = el("artwork").clientWidth * .96;
    const options = {duration:520,easing:"cubic-bezier(.22,1,.36,1)",fill:"both"};
    el("artwork-window").dataset.transition = direction > 0 ? "next" : direction < 0 ? "previous" : "replace";
    // The outgoing snapshot and incoming strip share the same queue spacing.
    // Pending previews move immediately; confirmation keeps or corrects them.
    transition.animations.push(
      ghost.animate([{transform:"translateX(0)",opacity:1},{transform:"translateX(" + (-direction * step) + "px)",opacity:0}],options),
      ...["artwork","artwork-previous","artwork-next"].map(id => {
        const node = el(id), base = id === "artwork" ? "" : "translateX(-50%) scale(.78)";
        return node.animate([{transform:"translateX(" + (direction * step) + "px) " + (base || "scale(.78)"),opacity:0},{transform:base || "none",opacity:id === "artwork" ? 1 : .4}],options);
      }),
      ...["title","artist"].map(id => el(id).animate([{transform:"translateX(" + (direction * 16) + "px)",opacity:0},{transform:"translateX(0)",opacity:1}],{...options,duration:360}))
    );
    if (direction) {
      transition.animations.push(ghost.querySelector(".artwork-current").animate([{transform:"scale(1)"},{transform:"scale(.78)"}],options));
    }
    Promise.all(transition.animations.map(animation=>animation.finished)).then(()=>{
      if (coverTransition === transition) clearTransition();
    }).catch(()=>{});
  }
  const motionChanged = () => { if (reducedMotion.matches) clearTransition(); };
  reducedMotion.addEventListener("change",motionChanged);
  function render(action) {
    const view = projectedPlayback();
    if (!view) { controls(); return; }
    const transition = beginTransition(view,action);
    displayedPlayback = view;
    renderArtwork();
    setTitle(view.track?.name || "Nothing playing");
    el("artist").textContent = (view.track?.artists || []).join(", ");
    const paused = view.state !== "playing";
    // SVGElement.hidden is not reflected into markup; use the actual attribute.
    el("play-icon").toggleAttribute("hidden", !paused);
    el("pause-icon").toggleAttribute("hidden", paused);
    el("play-pause").setAttribute("aria-label", paused ? "Resume" : "Pause");
    el("play-pause").title = paused ? "Resume" : "Pause";
    controls(); animateTransition(transition);
  }
  function accept(response, action) {
    const output = response?.structuredContent || response;
    if (response?.isError || output?.ok === false) throw Error(output?.error?.message || "Spotify could not confirm that action. Refresh before trying again.");
    const component = output?.component;
    if (component?.id !== "spotify.player" || component.version !== 1) return;
    const state = component.props?.playback;
    if (!state || !["playing","paused","stopped"].includes(state.state)) return;
    if (Number(state.observedAt) < newest) return;
    newest = Number(state.observedAt) || 0; playback = state; stale = false; render(action); return true;
  }
  function notify(method, params) {
    window.parent.postMessage({jsonrpc:"2.0",method,params}, hostOrigin || "*");
  }
  function request(method, params) {
    return new Promise((resolve,reject) => {
      const id = ++nextId;
      const timer = setTimeout(() => { requests.delete(id); reject(Error("Spotify did not respond. Refresh to check its current state; the action will not be repeated.")); }, 30000);
      requests.set(id, {resolve,reject,timer});
      window.parent.postMessage({jsonrpc:"2.0",id,method,params}, hostOrigin || "*");
    });
  }
  async function refresh(fresh = false) {
    if (disposed || !bridgeReady || reading || busy || pendingActions.length || document.hidden) return;
    reading = true; controls();
    const epoch = stateEpoch;
    try {
      const result = await request("tools/call", {name:targets.refresh,arguments:fresh ? {refresh:true} : {}});
      if (epoch !== stateEpoch) return;
      if (accept(result) && !fresh) el("error").textContent = "";
    } catch (error) {
      if (epoch === stateEpoch) { stale = true; el("error").textContent = error.message; render(); }
    } finally { reading = false; controls(); }
  }
  async function drainActions() {
    if (busy || disposed) return;
    busy = true; controls();
    let needsRefresh = false;
    try {
      while (pendingActions.length && !disposed) {
        const job = pendingActions[0];
        const result = await request("tools/call", {name:targets[job.name],arguments:job.args});
        if (disposed) return;
        // Remove only the completed intent before projecting the remaining clicks.
        pendingActions.shift();
        if (!accept(result,job.name)) throw Error("Spotify did not confirm the action. Checking playback; the action will not be repeated.");
      }
    } catch (error) {
      pendingActions.length = 0; stale = true;
      el("error").textContent = error.message;
      render(); needsRefresh = true;
    } finally {
      busy = false; controls();
      if (needsRefresh && !disposed) await refresh(true);
    }
  }
  function action(name, args = {}) {
    if (disposed || stale || !bridgeReady || pendingActions.length >= 8) return;
    stateEpoch++; pendingActions.push({name,args});
    el("error").textContent = "";
    render(name); // Immediate feedback, before any network round trip.
    void drainActions();
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || disposed) return;
    if (hostOrigin && event.origin !== hostOrigin) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (typeof message.id === "number" && requests.has(message.id)) {
      const pending = requests.get(message.id); requests.delete(message.id); clearTimeout(pending.timer);
      if (!hostOrigin && event.origin !== "null") hostOrigin = event.origin;
      if (message.error) pending.reject(Error(message.error.message || "Host rejected the request."));
      else pending.resolve(message.result);
    } else if (message.method === "ui/notifications/tool-result") {
      // Some hosts also broadcast a tool result before its RPC completes.
      // The owning response settles pending clicks exactly once.
      if (busy || pendingActions.length) return;
      try { accept(message.params); } catch (error) { el("error").textContent = error.message; }
    } else if (message.method === "ui/notifications/host-context-changed") {
      const theme = message.params?.theme;
      if (["light","dark"].includes(theme)) document.documentElement.style.colorScheme = theme;
    } else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
      dispose(); window.parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}}, hostOrigin || "*");
    }
  });
  el("play-pause").onclick = () => action(displayedPlayback?.state === "playing" ? "pause" : "resume");
  el("previous").onclick = () => action("previous"); el("next").onclick = () => action("next");
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  const polling = setInterval(refresh, 3000);
  const resize = new ResizeObserver(() => {
    measureTitle();
    if (bridgeReady && !disposed) notify("ui/notifications/size-changed", {height:Math.ceil(document.body.getBoundingClientRect().height)});
  });
  resize.observe(document.body);
  function dispose() {
    disposed = true; pendingActions.length = 0; clearInterval(polling);
    resize.disconnect(); clearTransition(); reducedMotion.removeEventListener("change",motionChanged);
    for (const p of requests.values()) { clearTimeout(p.timer); p.reject(Error("Player closed.")); }
    requests.clear();
  }
  window.addEventListener("pagehide", dispose, {once:true});
  if (window.parent === window) {
    setTitle("Spotify player"); el("error").textContent = "Open this component in a connected MCP Apps host to control Spotify."; controls();
  } else {
    request("ui/initialize", {appInfo:{name:"spotify-player",version:"1.0.0"},appCapabilities:{},protocolVersion:"2026-01-26"})
      .then(result => {
        if (disposed) return;
        bridgeReady = true;
        if (["light","dark"].includes(result?.hostContext?.theme)) document.documentElement.style.colorScheme = result.hostContext.theme;
        notify("ui/notifications/initialized", {}); notify("ui/notifications/size-changed", {height:document.documentElement.scrollHeight}); refresh();
      }).catch(error => { setTitle("Spotify player"); el("error").textContent = error.message; controls(); });
  }
})();
</script>
</body>
</html>
